<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Insomnia by Joel Soto</title>
    <!-- PLACEHOLDER: meta description, Open Graph and Twitter tags are added once the copy and the production URL exist. -->

    <!--
      3D chain: decided before first paint, as in the legacy site. When WebGL and
      modules are available (and the page is not opened from disk), `has-3d` hides
      the hero and band photos from the first frame. ChainStage removes the class
      again if three.js or the WebGL context fails, and the photos come back.
    -->
    <script>
      if (
        window.WebGLRenderingContext &&
        'noModule' in HTMLScriptElement.prototype &&
        location.protocol !== 'file:'
      ) {
        document.documentElement.classList.add('has-3d');
      }
    </script>

    <!-- Fonts: same families, weights and request as the legacy Black & White site -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Montserrat:wght@200;300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
