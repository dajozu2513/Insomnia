<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Head tags for the home page in Spanish, so crawlers and link previews that do not
      run JavaScript see a complete page. Each route rewrites them in the visitor's
      language (src/lib/head.ts); keep these values in sync with the home route there
      and with meta.description in src/i18n/es.ts.
    -->
    <title>Insomnia by Joel Soto</title>
    <meta name="description" content="Todo lo que sientes cuando el mundo duerme." />
    <link rel="canonical" href="https://insomnia-js.onrender.com/" />
    <meta name="theme-color" content="#0d0c0e" />
    <meta property="og:site_name" content="Insomnia by Joel Soto" />
    <meta property="og:title" content="Insomnia by Joel Soto" />
    <meta property="og:description" content="Todo lo que sientes cuando el mundo duerme." />
    <meta property="og:url" content="https://insomnia-js.onrender.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:image" content="https://insomnia-js.onrender.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Insomnia by Joel Soto" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Insomnia by Joel Soto" />
    <meta name="twitter:description" content="Todo lo que sientes cuando el mundo duerme." />
    <meta name="twitter:image" content="https://insomnia-js.onrender.com/og.png" />

    <!-- Icons: the pocket watch (public/; sources at /icon-source/:size) -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Insomnia by Joel Soto",
        "url": "https://insomnia-js.onrender.com/",
        "logo": "https://insomnia-js.onrender.com/icons/icon-512.png"
      }
    </script>

    <!--
      3D chain: decided before first paint, as in the legacy site. When WebGL and
      modules are available (and the page is not opened from disk), `has-3d` hides
      the hero and band photos from the first frame. ChainStage removes the class
      again if three.js or the WebGL context fails, and the photos come back.
    -->
    <script>
      if (
        window.WebGLRenderingContext &&
        'noModule' in HTMLScriptElement.prototype &&
        location.protocol !== 'file:'
      ) {
        document.documentElement.classList.add('has-3d');
      }
      // Atmosphere variants under review (src/features/atmosphere/variants.ts): ?atmo=a|b|c
      // chooses one for this browser session; any other value goes back to the current look.
      try {
        var atmo = new URLSearchParams(location.search).get('atmo');
        if (atmo === 'a' || atmo === 'b' || atmo === 'c')
          sessionStorage.setItem('insomnia-atmo', atmo);
        else if (atmo !== null) sessionStorage.removeItem('insomnia-atmo');
        var chosenAtmo = sessionStorage.getItem('insomnia-atmo');
        if (chosenAtmo) document.documentElement.dataset.atmo = chosenAtmo;
      } catch (e) {
        // no storage: the current look
      }
      // Intro splash: on the first visit to the home page in this tab, keep the page
      // ink until the splash mounts (IntroSplash.tsx uses the same key).
      try {
        if (
          location.pathname === '/' &&
          !/[?&](link|tee)=/.test(location.search) &&
          !location.hash &&
          !sessionStorage.getItem('insomnia-intro-seen')
        ) {
          document.documentElement.classList.add('intro-pending');
        }
      } catch (e) {
        // no storage: no splash
      }
    </script>

    <!-- Fonts are self-hosted (src/styles/fonts.css); the build preloads the title face. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
