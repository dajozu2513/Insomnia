<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Insomnia by Joel Soto</title>
    <!-- Must match meta.description in src/i18n/es.ts (LanguageProvider swaps it for English) -->
    <meta name="description" content="Todo lo que sientes cuando el mundo duerme." />
    <!-- PLACEHOLDER: Open Graph and Twitter tags arrive in step 9. -->

    <!--
      3D chain: decided before first paint, as in the legacy site. When WebGL and
      modules are available (and the page is not opened from disk), `has-3d` hides
      the hero and band photos from the first frame. ChainStage removes the class
      again if three.js or the WebGL context fails, and the photos come back.
    -->
    <script>
      if (
        window.WebGLRenderingContext &&
        'noModule' in HTMLScriptElement.prototype &&
        location.protocol !== 'file:'
      ) {
        document.documentElement.classList.add('has-3d');
      }
      // Intro splash: on the first visit to the home page in this tab, keep the page
      // ink until the splash mounts (IntroSplash.tsx uses the same key).
      try {
        if (location.pathname === '/' && !sessionStorage.getItem('insomnia-intro-seen')) {
          document.documentElement.classList.add('intro-pending');
        }
      } catch (e) {
        // no storage: no splash
      }
    </script>

    <!--
      Fonts: Cormorant Garamond (display) as the legacy site loaded it; EB Garamond
      400 and italic 400 (body); Montserrat 200/400/500 (labels, UI, clock).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=EB+Garamond:ital,wght@0,400;1,400&family=Montserrat:wght@200;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
